<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="https://img.icons8.com/parakeet-filled/48/box.png" type="image/x-icon">
    <title>Bin</title>
    <style>
        @font-face {
            font-family: 'Inter';
            src: url('https://fonts.zly.vg/inter/InterLatin.woff2');
        }

        /* Modern Reset & Variables (Matching index-2.html) */
        :root {
            --bg-color: #FAFAFA;
            --card-bg: #FFFFFF;
            --text-main: #1A1A1A;
            --text-secondary: #666666;
            --border-color: #E5E5E5;
            --primary-color: #1A1A1A;
            --primary-hover: #333333;
            --danger-color: #DC2626;
            --radius-md: 8px;
            --radius-sm: 4px;
            --font-main: 'Inter', sans-serif;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }

        * { box-sizing: border-box; }
        
        body {
            margin: 0;
            padding: 0;
            font-family: var(--font-main);
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            font-size: 0.875rem; /* 14px */
            zoom:.9;
        }

        /* Material Symbols Font */
        @font-face {
            font-family: 'Material Symbols Rounded';
            src: url("./msr.woff2");
            font-display: block;
        }

        /* Icon Helper */
        [data-icon]:before {
            content: attr(data-icon);
            font-family: 'Material Symbols Rounded';
            font-weight: normal;
            font-style: normal;
            font-size: 1.2em;
            line-height: 1;
            letter-spacing: normal;
            text-transform: none;
            display: inline-block;
            white-space: nowrap;
            word-wrap: normal;
            direction: ltr;
            vertical-align: middle;
            margin-right: 0.3em;
        }

        /* Layout */
        .app-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 1rem;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            margin: 0;
            letter-spacing: -0.025em;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .back-btn {
            text-decoration: none;
            color: var(--text-secondary);
            transition: color 0.2s;
            display: flex;
            align-items: center;
        }
        
        .back-btn:hover {
            color: var(--text-main);
        }

        .copy-url-btn {
            text-decoration: none;
            color: var(--text-secondary);
            cursor: pointer;
            transition: color 0.2s;
            display: flex;
            align-items: center;
        }
        
        .copy-url-btn:hover {
            color: var(--text-main);
        }

        .bin-title {
            display: flex;
            align-items: baseline;
            gap: 0.35rem;
            min-width: 0;
        }

        .uuid-ghost {
            font-family: monospace;
            color: var(--text-secondary);
            font-size: 0.5em;
            font-weight: normal;
            letter-spacing: 0;
        }

        .edit-alias-btn {
            text-decoration: none;
            color: var(--text-secondary);
            cursor: pointer;
            transition: color 0.2s;
            font-size: 0.8em;
            margin-left: 0.2em;
        }

        .edit-alias-btn:hover {
            color: var(--text-main);
        }

        .alias-input {
            border: none;
            border-bottom: 1px solid var(--border-color);
            font-size: 1.5rem;
            font-weight: 600;
            font-family: inherit;
            letter-spacing: -0.025em;
            outline: none;
            background: transparent;
            color: var(--text-main);
            width: 14rem;
            padding: 0;
        }

        /* Metadata Card */
        .meta-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 1rem;
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .meta-item {
            display: flex;
            align-items: center;
        }
        
        #creationTime, #expirationTime {
            /* font-family: monospace; */
            color: var(--text-main);
            font-weight: 500;
        }

        /* Editor Section */
        .editor-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-sm);
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            flex-grow: 1;
        }

        textarea#new {
            width: 100%;
            min-height: 400px; /* Taller for detail view */
            font-family: monospace;
            font-size: 0.9rem;
            resize: vertical;
            outline: none;
            transition: border-color 0.2s;
        }

        /* textarea 外框：按钮行位于内部底部 */
        .textarea-box {
            width: 100%;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 5px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: 3px;
            background: #FAFAFA;
            transition: border-color 0.2s, background-color 0.2s;
        }

        .textarea-box:focus-within {
            border-color: var(--text-main);
            background: #FFF;
        }

        .textarea-box textarea#new {
            border: none;
            border-radius: 0;
            background: transparent;
            padding: 0.75rem;
        }

        .textarea-actions {
            display: flex;
            gap: 5px;
            justify-content: flex-end;
            align-items: center;
        }

        /* Buttons */
        .button_group {
            display: flex;
            gap: 0.75rem;
            align-items: center;
            flex-wrap: wrap;
        }

        button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.35rem 0.8rem;
            border: 1px solid var(--border-color);
            background-color: var(--card-bg);
            border-radius: var(--radius-sm);
            font-family: var(--font-main);
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--text-main);
        }

        button:hover:not(:disabled) {
            background-color: #F5F5F5;
            border-color: #D4D4D4;
        }

        button:active:not(:disabled) {
            transform: translateY(1px);
        }

        button.danger, button.red {
            color: var(--danger-color);
            border-color: rgba(220, 38, 38, 0.2);
        }
        
        button.danger:hover:not(:disabled), button.red:hover:not(:disabled) {
            background-color: #FEF2F2;
            border-color: var(--danger-color);
        }

        button.pinned {
            background-color: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        button.pinned:hover:not(:disabled) {
            background-color: var(--primary-hover);
            border-color: var(--primary-hover);
        }

        button.disabled, button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            pointer-events: none;
        }
        
        /* Utility */
        .spacer {
            margin-left: auto;
        }
        
        .icon {
            font-family: 'Material Symbols Rounded';
            font-style: normal;
            display: inline-block;
            vertical-align: middle;
            line-height: 1;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .app-container {
                padding: 1rem;
                gap: 1rem;
            }

            .meta-card {
                flex-direction: column;
                gap: 0.5rem;
            }
            
            .button_group {
                flex-direction: column;
                align-items: stretch;
            }
            
            .spacer {
                margin-left: 0;
            }
        }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <h1>
            <a href='javascript:history.back()' class="back-btn icon" data-icon="arrow_circle_left" title="Back"></a>
            <span class="bin-title" id="binTitle"><span style="font-family: monospace;">#<span id="binId">...</span></span></span>
            <input id="aliasInput" class="alias-input" hidden placeholder="Alias">
            <a class="edit-alias-btn icon" data-icon="edit" title="Edit alias" onclick="editAlias()"></a>
            <a class="copy-url-btn icon" title="Copy bin URL" data-icon="content_copy" style="font-size: 0.8em; margin-left: 0.2em;"></a>
        </h1>
    </header>

    <div class="meta-card" id="bin_info">
        <div class="meta-item">
            <span class="icon" data-icon="date_range" style="margin-right: 0.4em;"></span>
            Created: &nbsp;<span id="creationTime">...</span>
        </div>
        
        <div class="meta-item">
            <span class="icon" data-icon="search_activity" style="margin-right: 0.4em;"></span>
            Expires: &nbsp;<span id="expirationTime">...</span>
        </div>
    </div>

    <div class="editor-card">
        <div class="textarea-box">
            <textarea id="new" placeholder="Loading content..."></textarea>
            <div class="textarea-actions">
                <button data-icon="content_paste_go" onclick="OurBinClipboard.pasteInto(document.getElementById('new'))">Paste</button>
                <button class="red" data-icon="delete" onclick="OurBinClipboard.clearInto(document.getElementById('new'))">Clear</button>
            </div>
        </div>
        
        <div class="button_group">
            <button data-icon="copy_all" onclick="copyContent()">Copy all</button> 
            <button data-icon="article_shortcut" class="raw-btn" id="viewRawBtn" title="View Raw" onclick="viewRaw()">Raw</button> 
            <button data-icon="keep" id="pin_btn">Pin</button>
            
            <button data-icon="save_as" class="disabled spacer" id="save_btn">Save edited</button>
            
            <button data-icon="delete" class="red">Void</button>
        </div>
    </div>
</div>

<footer style="background-color: var(--bg-color); position: fixed; bottom: 0; padding: .5rem 0; width: 100%; left:0; box-sizing: border-box; text-align: center; font-size: x-small;">
    <a href="http://github.com/xolyn/ourbin">OurBin</a> is a opensource LAN clipboard, powered by <a href="https://zhoulingyu.net" target="_blank">Uygnil</a>
</footer>

<script src="settings.js"></script>
<script src="clipboard.js"></script>
<script src="bin.js"></script>

<script>
    function copyContent() {
        const textarea = document.getElementById('new');
        textarea.select();
        OurBinClipboard.copy(textarea.value).then(() => {
            // Optional: visual feedback
            const btn = document.querySelector('button[data-icon="copy_all"]');
            const originalText = btn.innerHTML;
            btn.innerHTML = 'Copied!';
            setTimeout(() => btn.innerHTML = originalText, 2000);
        });
    }
    
    // Enable save button on input
    document.getElementById('new').addEventListener('input', function() {
        const saveBtn = document.querySelector('button[data-icon="save_as"]');
        if (saveBtn) saveBtn.classList.remove('disabled');
    });
</script>
</body>
</html>
